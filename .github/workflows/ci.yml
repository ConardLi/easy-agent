name: Continuous integration

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-gate:
    name: Production gate (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run verify:production

  release-artifact:
    name: Release artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm ci
      - run: npm run test:stage36

  portability:
    name: Core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run verify:production:core
      - run: npm run test:hooks-hardening

  sandbox-host:
    name: Host sandbox integration
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm ci
      - run: npm run verify:production:platform

  sandbox-host-linux:
    name: Host sandbox integration (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep
      - name: Enable unprivileged user namespaces for the sandbox test
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # The bwrap-userns-restrict profile strips capabilities from bwrap's children, so the
          # seccomp helper cannot create its nested namespace.
          if sudo grep -q '^bwrap ' /sys/kernel/security/apparmor/profiles; then
            sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
          fi
          sudo grep -i bwrap /sys/kernel/security/apparmor/profiles || echo "no bwrap AppArmor profile loaded"
      - run: npm ci
      - run: npm run verify:production:platform
