name: Release npm package

on:
  push:
    tags:
      - "v*"

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  old-node-gate:
    name: Verify the Node 20 failure path
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          package-manager-cache: false
      - name: Expect an actionable Node version error
        shell: bash
        run: |
          set +e
          output="$(node dist/eagent.js --version 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          case "$output" in
            *"requires Node.js 22 or newer"*) ;;
            *) printf '%s\n' "$output" >&2; exit 1 ;;
          esac

  portability:
    name: Core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run verify:production:core
      - run: npm run test:hooks-hardening

  release-gate-macos:
    name: Release gate (macOS)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm ci
      - run: npm run verify:release

  publish:
    name: Verify and publish
    needs: [old-node-gate, portability, release-gate-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep
      - name: Enable unprivileged user namespaces for the sandbox test
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: npm run verify:release
      - name: Verify tag and choose npm channel
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "$GITHUB_REF_NAME"
          case "$version" in
            *-*) printf 'tag=next\n' >> "$GITHUB_OUTPUT" ;;
            *) printf 'tag=latest\n' >> "$GITHUB_OUTPUT" ;;
          esac
      # verify:release already built and tested dist/. Skipping lifecycle
      # scripts publishes exactly that artifact instead of rebuilding it and
      # running the whole gate a second time through prepublishOnly.
      - name: Publish with provenance
        run: npm publish --ignore-scripts --provenance --access public --tag "${{ steps.release.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
